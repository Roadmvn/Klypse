name: Review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-gate:
    name: Release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            build-essential \
            dbus-x11 \
            desktop-file-utils \
            gettext \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libadwaita-1-dev \
            libgettextpo-dev \
            libglib2.0-bin \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libsqlite3-dev \
            libxcb-composite0-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            pkg-config \
            xauth \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run the release gate
        run: bash scripts/verify-release.sh

  debian-package:
    name: Build and inspect Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Debian package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            build-essential \
            cargo \
            debhelper \
            desktop-file-utils \
            dpkg-dev \
            gettext \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libadwaita-1-dev \
            libgettextpo-dev \
            libglib2.0-bin \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libsqlite3-dev \
            libxcb-composite0-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            lintian \
            pkg-config \
            rustc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect package
        run: |
          deb="$(find .. -maxdepth 1 -name 'klypse_*_amd64.deb' -print -quit)"
          test -n "$deb"
          bash scripts/test-debian-package.sh "$deb"
          lintian --fail-on error "$deb"
          mkdir -p build/debian
          cp "$deb" build/debian/

      - name: Publish Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: klypse-debian-amd64
          path: build/debian/*.deb
          if-no-files-found: error
          retention-days: 14

  flatpak-package:
    name: Build and smoke-test Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak-builder

      - name: Validate generated sources and manifest
        run: |
          python3 -m json.tool packaging/flatpak/cargo-sources.json >/dev/null
          flatpak-builder --show-manifest \
            packaging/flatpak/io.github.roadmvn.Klypse.yml >/dev/null

      - name: Build, install, and smoke-test the application
        run: |
          bash scripts/build-flatpak.sh
          bash scripts/test-flatpak.sh

      - name: Export Flatpak bundle
        run: |
          flatpak build-bundle \
            build/flatpak-repo \
            build/Klypse.flatpak \
            io.github.roadmvn.Klypse

      - name: Publish Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: klypse-flatpak-amd64
          path: build/Klypse.flatpak
          if-no-files-found: error
          retention-days: 14
